# Oyunu GitHub Pages'te yayınlar (ücretsiz).
# Ayar: Settings → Pages → Source: "GitHub Actions"
name: GitHub Pages

on:
  push:
    branches: [claude/block-fusion-infinite-mode-xubu4z]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site dosyalarını hazırla (yalnızca oyun; android/ios/node_modules hariç)
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r www _site/www
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
