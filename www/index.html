<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1638">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS: ana ekrana eklenince tam ekran -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Block Fusion">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Block Fusion – Sonsuz Mod blok bulmaca oyunu">
  <title>Block Fusion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud-best" aria-label="En iyi skor">
        <span class="hud-label">EN İYİ</span>
        <span id="best-score" class="hud-value">0</span>
      </div>
      <div class="hud-score">
        <span id="score" class="score-value">0</span>
        <span id="combo" class="combo" aria-live="polite"></span>
      </div>
      <div class="hud-actions">
        <button id="settings-btn" class="icon-btn" aria-label="Ayarlar" title="Ayarlar">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
        <button id="restart-btn" class="icon-btn" aria-label="Yeniden başlat" title="Yeniden başlat">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
      </div>
    </header>

    <main class="play-area">
      <div id="board" class="board" role="grid" aria-label="Oyun tahtası">
        <div id="board-grid" class="board-grid"></div>
        <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
      </div>
    </main>

    <div id="rotate-bar" class="rotate-bar">
      <div class="rot-count" aria-label="Döndürme hakkı">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        <span id="rot-count">5</span>
      </div>
      <span id="rot-hint" class="rot-hint">Döndürmek için parçaya dokun</span>
      <button id="rot-ad-btn" class="rot-ad-btn hidden" aria-label="Reklam izleyerek döndürme hakkı kazan">
        <span class="play">▶</span> <span id="rot-ad-label">+5 hak</span>
      </button>
    </div>

    <footer id="tray" class="tray" aria-label="Blok parçaları"></footer>
  </div>

  <div id="drag-layer" class="drag-layer" aria-hidden="true"></div>

  <div id="gameover" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="go-title">
    <div class="overlay-card">
      <h2 id="go-title">Hamle Kalmadı!</h2>
      <p class="go-label">Skor</p>
      <p id="go-score" class="go-score">0</p>
      <p id="go-best" class="go-best">En iyi: 0</p>
      <p id="go-newbest" class="go-newbest hidden">Yeni rekor!</p>
      <button id="go-restart" class="primary-btn">Tekrar Oyna</button>
    </div>
  </div>

  <div id="confirm" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-card">
      <h2>Yeniden başlatılsın mı?</h2>
      <p class="go-label">Mevcut oyun kaybolacak.</p>
      <div class="btn-row">
        <button id="confirm-no" class="secondary-btn">Vazgeç</button>
        <button id="confirm-yes" class="primary-btn">Başlat</button>
      </div>
    </div>
  </div>

  <div id="reward" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="reward-title">
    <div class="overlay-card">
      <div class="reward-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </div>
      <h2 id="reward-title">Döndürme hakkın bitti</h2>
      <p id="reward-text" class="reward-text"></p>
      <p id="reward-error" class="reward-error hidden" role="alert"></p>
      <button id="reward-watch" class="primary-btn">▶ Reklam İzle</button>
      <button id="reward-skip" class="text-btn">Hayır, teşekkürler</button>
    </div>
  </div>

  <div id="settings" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="overlay-card settings-card">
      <h2 id="settings-title">Ayarlar</h2>
      <label class="setting-row">
        <span class="setting-text"><b>Titreşim</b><small id="vib-note">Dokunsal geri bildirim</small></span>
        <input type="checkbox" id="set-vibration" class="switch">
      </label>
      <label class="setting-row">
        <span class="setting-text"><b>Yoğun görsel efektler</b><small>Ekran sarsıntısı, renk dalgaları, parçacıklar</small></span>
        <input type="checkbox" id="set-effects" class="switch">
      </label>
      <h3 class="settings-sub">Tema <small>Sonsuz Mod</small></h3>
      <div id="theme-grid" class="theme-grid" role="radiogroup" aria-label="Tema seçimi"></div>
      <button id="settings-close" class="primary-btn">Tamam</button>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <noscript>Bu oyun JavaScript gerektirir.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
